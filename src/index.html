<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Conduit</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    
    <!-- ================================================================================
         MAUVAISE PRATIQUE BP32: Polices NON standards téléchargées
         Au lieu d'utiliser les polices système (Arial, Helvetica, Times, etc.),
         on charge de nombreuses polices externes via Google Fonts.
         Chaque police = requêtes HTTP + téléchargement de fichiers lourds (woff2)
         ================================================================================ -->
    
    <!-- MAUVAISE PRATIQUE: Google Fonts - nombreuses polices non standards -->
    <!-- Chaque police génère plusieurs requêtes et télécharge des fichiers lourds -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Police 1: Roboto avec plusieurs variantes (400, 500, 700) - ~150Ko -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- Police 2: Open Sans avec plusieurs variantes - ~150Ko -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Police 3: Lato avec plusieurs variantes - ~140Ko -->
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
    
    <!-- Police 4: Montserrat avec plusieurs variantes - ~160Ko -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Police 5: Poppins avec plusieurs variantes - ~150Ko -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Police 6: Raleway avec plusieurs variantes - ~145Ko -->
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Police 7: Nunito avec plusieurs variantes - ~140Ko -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Police 8: Playfair Display pour les titres - ~100Ko -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Police 9: Oswald pour les accents - ~90Ko -->
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Police 10: Source Code Pro pour le code - ~120Ko -->
    <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- MAUVAISE PRATIQUE BP35: Trop de fichiers CSS (multiplie les requêtes HTTP) -->
    <!-- Au lieu de limiter à 3-10 fichiers CSS, on en charge plus de 15 séparément -->
    <!-- Chaque fichier CSS génère une requête HTTP supplémentaire -->
    
    <!-- CSS Framework principal -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    
    <!-- CSS supplémentaires inutiles - MAUVAISE PRATIQUE -->
    <!-- Bootstrap utilities séparé (déjà inclus dans bootstrap) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap-utilities.min.css" rel="stylesheet" />
    <!-- Bootstrap grid séparé (déjà inclus dans bootstrap) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap-grid.min.css" rel="stylesheet" />
    <!-- Bootstrap reboot séparé (déjà inclus dans bootstrap) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap-reboot.min.css" rel="stylesheet" />
    
    <!-- Animate.css - animations CSS (souvent inutilisées) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet" />
    
    <!-- Hover.css - effets hover (rarement utilisés en totalité) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/hover.css/2.3.1/css/hover-min.css" rel="stylesheet" />
    
    <!-- Normalize.css (déjà géré par Bootstrap) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" rel="stylesheet" />
    
    <!-- Pure.css buttons (inutile avec Bootstrap) -->
    <link href="https://cdn.jsdelivr.net/npm/purecss@3.0.0/build/buttons-min.css" rel="stylesheet" />
    
    <!-- Pure.css forms (inutile avec Bootstrap) -->
    <link href="https://cdn.jsdelivr.net/npm/purecss@3.0.0/build/forms-min.css" rel="stylesheet" />
    
    <!-- Pure.css tables (inutile avec Bootstrap) -->
    <link href="https://cdn.jsdelivr.net/npm/purecss@3.0.0/build/tables-min.css" rel="stylesheet" />
    
    <!-- Skeleton CSS (framework CSS léger mais redondant) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/skeleton/2.0.4/skeleton.min.css" rel="stylesheet" />
    
    <!-- Milligram CSS (autre framework CSS redondant) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/milligram/1.4.1/milligram.min.css" rel="stylesheet" />
    
    <!-- Tachyons CSS (encore un autre framework) -->
    <link href="https://unpkg.com/tachyons@4.12.0/css/tachyons.min.css" rel="stylesheet" />
    
    <!-- Bulma CSS (framework CSS complet, totalement redondant) -->
    <link href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css" rel="stylesheet" />
    
    <script
      src="https://kit.fontawesome.com/d0dc468526.js"
      crossorigin="anonymous"
    ></script>
    <!-- MAUVAISE PRATIQUE: Scripts officiels des réseaux sociaux (lourds, génèrent beaucoup de requêtes) -->
    <!-- Facebook SDK -->
    <script async defer crossorigin="anonymous" src="https://connect.facebook.net/fr_FR/sdk.js#xfbml=1&version=v18.0" nonce="ABC123"></script>
    <!-- Twitter Widget -->
    <script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
    <!-- LinkedIn SDK -->
    <script src="https://platform.linkedin.com/in.js" type="text/javascript">lang: fr_FR</script>
    <!-- Pinterest SDK -->
    <script async defer src="//assets.pinterest.com/js/pinit.js"></script>
  </head>
  <body>
    <!-- MAUVAISE PRATIQUE: Div requise par le SDK Facebook -->
    <div id="fb-root"></div>
    <app-root></app-root>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
