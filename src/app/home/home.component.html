<!-- MAUVAISE PRATIQUE BP12: Éléments décoratifs HTML inutiles -->
<!-- MAUVAISE PRATIQUE BP18: Contenu de bannière chargé dynamiquement au lieu d'être statique -->
<div class="banner" *ngIf="!isAuthenticated()">
  <!-- MAUVAISE PRATIQUE: Divs décoratifs vides qui augmentent le DOM -->
  <div class="decorative-circle decorative-circle-1"></div>
  <div class="decorative-circle decorative-circle-2"></div>
  <div class="decorative-circle decorative-circle-3"></div>

  <!-- ================================================================================
       MAUVAISE PRATIQUE BP100: SVG non optimisés
       Ces fichiers SVG contiennent des métadonnées Adobe/Inkscape, calques vides,
       définitions inutilisées, commentaires de développement, etc.
       Un fichier optimisé serait 3-4 fois plus léger
       ================================================================================ -->
  
  <!-- SVG logo non optimisé (~8Ko au lieu de ~1Ko si optimisé) -->
  <img src="assets/images/logo-unoptimized.svg" 
       alt="Logo SVG non optimisé" 
       class="banner-svg-unoptimized"
       width="100" 
       height="100" />

  <!-- ================================================================================
       MAUVAISE PRATIQUE BP48: Redimensionner les images côté navigateur
       Images de GRANDE taille (1920px, 2000px) affichées en PETIT (50px, 80px)
       Le navigateur télécharge les fichiers lourds puis les redimensionne inutilement
       ================================================================================ -->
  
  <!-- Image logo 2000x2000 affichée en 80x80 = 96% de pixels inutiles téléchargés -->
  <img src="https://picsum.photos/2000/2000" 
       alt="Logo" 
       class="banner-logo-oversized"
       width="80" 
       height="80" />
  
  <!-- Image décorative 1920x1080 affichée en 120x68 = 99% de pixels inutiles -->
  <img src="https://picsum.photos/1920/1080" 
       alt="Decoration" 
       class="banner-decoration-oversized"
       width="120" 
       height="68" />

  <h1 class="title">
    <!-- MAUVAISE PRATIQUE BP18: Emoji et titre chargés dynamiquement -->
    <span class="emoji-decorator">{{ bannerContent().titleEmoji1 }}</span>
    {{ bannerContent().title }}
    <span class="emoji-decorator">{{ bannerContent().titleEmoji2 }}</span>
  </h1>
  <p class="description">
    <!-- MAUVAISE PRATIQUE BP18: Description chargée dynamiquement -->
    <span class="separator">{{ bannerContent().separator }}</span>
    {{ bannerContent().description }}
    <span class="separator">{{ bannerContent().separator }}</span>
  </p>

  <!-- MAUVAISE PRATIQUE: Barre décorative inutile -->
  <div class="decorative-bar"></div>
</div>
<div
  class="news-feed row"
  [style.marginTop]="!isAuthenticated() ? '232px' : ''"
>
  <div class="col-9">
    <app-feed-toggle (toggleFeed)="toggleFeed($event)"></app-feed-toggle>
    <app-article-list (toggleFavorite)="toggleFavorite($event)" [articleList]="articleList"></app-article-list>
    <app-pagination
      [totalCount]="articleCount"
      [offset]="currentOffset"
      (offsetChange)="onPageOffsetChange($event)"
    ></app-pagination>
  </div>
  <div class="col-3">
    <app-tags (selectTag)="selectTag($event)"></app-tags>
  </div>
</div>
