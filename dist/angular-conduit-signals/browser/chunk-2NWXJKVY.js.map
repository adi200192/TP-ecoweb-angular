<!-- MAUVAISE PRATIQUE BP4: Pas d'approche mobile first -->
<div class="article-preview">
  <!-- MAUVAISE PRATIQUE: Image décorative desktop chargée même sur mobile -->
  <div class="desktop-only-decoration"></div>

  <!-- ================================================================================
       MAUVAISE PRATIQUE BP100: SVG non optimisés
       Ces fichiers contiennent des métadonnées inutiles (Adobe/Inkscape), 
       calques vides, définitions CSS non utilisées, commentaires de développement
       ================================================================================ -->
  
  <!-- MAUVAISE PRATIQUE BP51: loading="eager" force le téléchargement immédiat -->
  <!-- Icône article en SVG non optimisé (~4Ko au lieu de ~500o si optimisé) -->
  <img src="assets/images/article-unoptimized.svg" 
       alt="Article icon" 
       class="article-icon-svg-unoptimized"
       loading="eager" />

  <!-- ================================================================================
       MAUVAISE PRATIQUE BP48: Redimensionner les images côté navigateur
       Images de GRANDE taille téléchargées puis réduites en CSS
       Au lieu d'utiliser des images à la bonne taille ou srcset/sizes
       ================================================================================ -->
  
  <!-- MAUVAISE PRATIQUE BP51: loading="eager" - télécharge TOUTES les images immédiatement -->
  <!-- Même les articles sous la ligne de flottaison sont chargés -->
  <!-- Image de fond d'article 1600x900 affichée en miniature 200x113 -->
  <img src="https://picsum.photos/1600/900" 
       alt="Article thumbnail" 
       class="article-thumbnail-oversized"
       loading="eager" />

  <div class="article-meta">
    <!-- MAUVAISE PRATIQUE BP51: loading="eager" sur TOUS les avatars -->
    <!-- MAUVAISE PRATIQUE BP48: Avatar 800x800 affiché en 48x48 = 99.6% pixels inutiles -->
    <!-- MAUVAISE PRATIQUE: Image sans srcset/sizes, pas d'adaptation mobile -->
    <!-- Devrait utiliser: <img srcset="small.jpg 320w, medium.jpg 768w, large.jpg 1024w" sizes="..."> -->
    <!-- On charge l'avatar original puis on force sa taille via un fallback vers une image 800x800 -->
    <img alt="avatar" 
         class="avatar avatar-oversized" 
         [src]="article.author.image || 'https://picsum.photos/800/800'"
         loading="eager" />
    <div class="info">
      <a [routerLink]="'/@' + article.author.username" class="author">{{
        article.author.username
      }}</a>
      <p class="date">{{ article.createdAt | date : "MMMM d, y" }}</p>
    </div>
    <button
      class="btn btn-sm ms-auto"
      [ngClass]="article.favorited ? 'unfavorite-btn' : 'favorite-btn'"
      (click)="toggleFavorite.emit(article)"
    >
      <!-- MAUVAISE PRATIQUE BP100: SVG favori non optimisé (métadonnées Adobe/Inkscape) -->
      <!-- MAUVAISE PRATIQUE BP50: Image au lieu de glyphe ♥ ou icône Font Awesome -->
      <img src="assets/images/heart-unoptimized.svg" alt="heart" class="icon-svg-unoptimized" /> {{ article.favoritesCount }}
    </button>
  </div>
  <div [routerLink]="['/article', article.slug]" class="preview-link">
    <h1 class="title">
      {{ article.title }}
    </h1>
    <p class="description">
      {{ article.description }}
    </p>
    <div class="footer">
      <!-- MAUVAISE PRATIQUE BP50: Image au lieu de glyphe → -->
      <span class="read-more">Read more...<img src="https://cdn-icons-png.flaticon.com/16/271/271228.png" alt="arrow" class="icon-image ms-1" /></span>
      <div class="tags">
        <ng-container *ngFor="let tag of article.tagList"
          ><span class="tag-default">{{ tag }}</span>
        </ng-container>
      </div>
    </div>
  </div>
</div>
